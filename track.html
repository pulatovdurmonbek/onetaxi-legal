<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneTaxi — safarni kuzatish</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --g:#12A150; --d:#16231B; }
  html,body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--d); }
  #map { position:absolute; inset:0; }
  .card { position:absolute; left:12px; right:12px; bottom:12px; background:#fff; border-radius:16px;
          box-shadow:0 6px 24px rgba(0,0,0,.18); padding:14px 16px; max-width:520px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:10px; }
  .st { font-weight:800; font-size:18px; }
  .muted { color:#5b6b62; font-size:14px; }
  .plate { border:2px solid #111; border-radius:6px; padding:2px 8px; font-weight:900; letter-spacing:1px; font-family:monospace; }
  .brand { position:absolute; top:12px; left:12px; background:var(--g); color:#fff; font-weight:800; padding:6px 12px; border-radius:10px; }
  .err { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; background:#f4f5f2; }
</style>
</head>
<body>
<div id="map"></div>
<div class="brand">OneTaxi</div>
<div class="card" id="card">
  <div class="st" id="status">Yuklanmoqda… / Загрузка…</div>
  <div class="row" style="margin-top:8px">
    <div style="flex:1">
      <div id="car"></div>
      <div class="muted" id="driver"></div>
    </div>
    <div class="plate" id="plate" style="display:none"></div>
  </div>
  <div class="muted" id="route" style="margin-top:8px"></div>
  <div class="muted" id="upd" style="margin-top:6px;font-size:12px"></div>
</div>
<div class="err" id="err">
  <div><h2>Havola eskirgan yoki safar tugagan</h2><p>Ссылка устарела или поездка завершена.</p></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // Faqat ochiq (publishable) kalit — ma'lumot faqat shu havola egasiga, safar davomida ko'rinadi.
  const SUPABASE_URL = 'https://yqjibnkqmalcofnjenho.supabase.co';
  const KEY = 'sb_publishable_xFnLrVXAQN8-tpU9SkF0fg__45VC_XQ';
  const token = new URLSearchParams(location.search).get('t') || '';
  const STATUS = {
    created: 'Haydovchi qidirilmoqda / Ищем водителя',
    searching: 'Haydovchi qidirilmoqda / Ищем водителя',
    driver_assigned: "Haydovchi yo'lda / Водитель едет",
    driver_arriving: "Haydovchi yo'lda / Водитель едет",
    arrived: 'Haydovchi yetib keldi / Водитель на месте',
    ride_started: 'Safar davom etmoqda / В пути',
    ride_completed: 'Safar tugadi / Поездка завершена',
    paid_cash: 'Safar tugadi / Поездка завершена',
  };
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [69.2797, 41.3111], zoom: 12, attributionControl: { compact: true },
  });
  const carMarker = new maplibregl.Marker({ color: '#12A150' });
  const aMarker = new maplibregl.Marker({ color: '#2e7d32', scale: 0.8 });
  const bMarker = new maplibregl.Marker({ color: '#c62828', scale: 0.8 });
  let first = true;

  async function tick() {
    if (!/^[0-9a-f]{36}$/.test(token)) return fail();
    try {
      const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/shared_ride', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: token }),
      });
      const rows = await r.json();
      if (!Array.isArray(rows) || rows.length === 0) return fail();
      const s = rows[0];
      document.getElementById('status').textContent = STATUS[s.status] || s.status;
      document.getElementById('car').textContent = [s.car, s.car_color].filter(Boolean).join(' · ');
      document.getElementById('driver').textContent = s.driver_name ? 'Haydovchi / Водитель: ' + s.driver_name : '';
      const pl = document.getElementById('plate');
      if (s.plate) { pl.textContent = s.plate; pl.style.display = 'block'; }
      document.getElementById('route').textContent =
        [s.pickup_address, s.dropoff_address].filter(Boolean).join('  →  ');
      if (s.driver_at) document.getElementById('upd').textContent =
        'Yangilandi / Обновлено: ' + new Date(s.driver_at).toLocaleTimeString();
      if (s.pickup_lat) aMarker.setLngLat([s.pickup_lng, s.pickup_lat]).addTo(map);
      if (s.dropoff_lat) bMarker.setLngLat([s.dropoff_lng, s.dropoff_lat]).addTo(map);
      if (s.driver_lat) {
        carMarker.setLngLat([s.driver_lng, s.driver_lat]).addTo(map);
        if (first) { map.jumpTo({ center: [s.driver_lng, s.driver_lat], zoom: 14 }); first = false; }
        else map.easeTo({ center: [s.driver_lng, s.driver_lat], duration: 800 });
      } else if (first && s.pickup_lat) {
        map.jumpTo({ center: [s.pickup_lng, s.pickup_lat], zoom: 14 }); first = false;
      }
    } catch (e) { /* tarmoq xatosi — keyingi safar urinamiz */ }
  }
  function fail() {
    document.getElementById('err').style.display = 'flex';
    clearInterval(timer);
  }
  const timer = setInterval(tick, 5000);
  tick();
</script>
</body>
</html>
